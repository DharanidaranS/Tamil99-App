<html lang="en">

      display: block;
      padding: 1.5rem;

      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 600;
    }
    a.card:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      background-color: #eaf2f8;
    }
  </style>
</head>
